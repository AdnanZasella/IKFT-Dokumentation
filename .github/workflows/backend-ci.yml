name: Backend CI

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      # Docker finns på ubuntu-latest, så Testcontainers fungerar.
      - name: Bygg och testa
        run: ./mvnw --batch-mode verify

      # Sparas även när något fallerar, så att felet går att läsa utan att köra om lokalt.
      - name: Spara test- och täckningsrapporter
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-rapporter
          path: |
            backend/target/surefire-reports/
            backend/target/site/jacoco/
          retention-days: 14
          if-no-files-found: ignore