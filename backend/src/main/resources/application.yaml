spring:
  application:
    name: backend
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
# OpenAPI-beskrivningen är avstängd som standard och finns därför inte i drift. Kontraktstestet slår på den för
# att skapa admin/src/api/openapi.json, som typerna i admin-appen genereras ur.
springdoc:
  api-docs:
    enabled: false
  paths-to-match: /api/v1/**
  default-produces-media-type: application/json
