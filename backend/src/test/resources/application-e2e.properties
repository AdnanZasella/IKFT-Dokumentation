# Profilen e2e: backenden som E2E-testerna i e2e/ körs mot. Aktiveras med
# ./mvnw spring-boot:test-run -Dspring-boot.run.profiles=e2e
# Filen ligger i src/test och följer inte med den byggda appen.

# Databasen kommer från Testcontainers (TestBackendApplication). Compose-stödet skulle annars också försöka starta
# Postgres ur compose.yaml.
spring.docker.compose.enabled=false

# CI väntar på /actuator/health/readiness, som blir UP först när alla ApplicationRunner har körts, alltså efter att
# E2eDataInitializer har satt lösenorden. Slås på uttryckligen, så att det inte beror på att Spring tror sig köra i
# Kubernetes.
management.endpoint.health.probes.enabled=true
